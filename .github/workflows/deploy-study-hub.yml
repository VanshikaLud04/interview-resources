name: Deploy Interview Hub

on:
  push:
    branches: [main]
    paths:
      - 'study-app/**'
      - '.github/workflows/deploy-study-hub.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload study hub
        uses: actions/upload-pages-artifact@v3
        with:
          path: study-app
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
