<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#181322">
  <meta name="description" content="A focused, offline-friendly interview preparation hub.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Interview Hub">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <title>Vanshika's Interview Hub</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  
  <style>
    :root {
      --bg: #11101a;
      --surface: rgba(28, 25, 42, 0.72);
      --surface-strong: #1c192a;
      --card: rgba(255, 255, 255, 0.055);
      --card-hover: rgba(255, 255, 255, 0.09);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent: #c084fc;
      --accent-deep: #7c3aed;
      --accent-secondary: #f0abfc;
      --accent-glow: rgba(192, 132, 252, 0.22);
      --success: #34d399;
      --warning: #fbbf24;
      --text: #fcfaff;
      --text-muted: #b8b1c8;
      --sidebar-width: 276px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'DM Sans', sans-serif;
    }

    body {
      background:
        radial-gradient(circle at 88% 4%, rgba(192, 132, 252, 0.18), transparent 24rem),
        radial-gradient(circle at 48% 100%, rgba(45, 212, 191, 0.09), transparent 26rem),
        var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      background: linear-gradient(180deg, rgba(37, 32, 55, 0.92), rgba(22, 20, 34, 0.86));
      backdrop-filter: blur(24px);
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      padding: 28px 16px;
      z-index: 10;
      overflow-y: auto;
    }

    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }

    .logo {
      font-size: 21px;
      font-weight: 800;
      color: var(--text);
      margin: 0 8px 30px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo span {
      background: linear-gradient(120deg, #f5d0fe, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      color: var(--text-muted);
      text-decoration: none;
      border-radius: 10px;
      margin-bottom: 3px;
      transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
      font-weight: 500;
      cursor: pointer;
    }

    .nav-link:hover, .nav-link.active {
      background: var(--card-hover);
      color: var(--text);
      transform: translateX(2px);
    }
    
    .nav-link.active {
      background: linear-gradient(90deg, rgba(192, 132, 252, 0.2), rgba(192, 132, 252, 0.04));
      color: #fff;
      border: 1px solid rgba(216, 180, 254, 0.42);
      box-shadow: inset 3px 0 0 var(--accent);
    }

    /* Main Area */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Topbar */
    .topbar {
      height: 72px;
      background: rgba(19, 17, 29, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 44px;
      z-index: 5;
    }

    .streak-container {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .streak-text {
      font-size: 18px;
      font-weight: 700;
      color: #fde68a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .calendar-dots {
      display: flex;
      gap: 4px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--card-border);
    }
    .dot.active {
      background: var(--success);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
    }

    .btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover { background: rgba(255,255,255,0.14); transform: translateY(-1px); }
    .btn-primary { background: linear-gradient(115deg, var(--accent-deep), #a855f7); border-color: transparent; box-shadow: 0 8px 20px rgba(124, 58, 237, 0.27); }
    .btn-primary:hover { background: linear-gradient(115deg, #6d28d9, #9333ea); }

    /* Content Area */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 48px 44px;
      scroll-behavior: smooth;
    }

    .content::-webkit-scrollbar { width: 8px; }
    .content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 8px; }

    .section {
      display: none;
      max-width: 980px;
      margin: 0 auto;
      animation: fadeIn 0.3s ease forwards;
    }
    
    .section.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .section-header {
      margin-bottom: 28px;
    }

    .section-title {
      font: 800 40px/1.15 'Playfair Display', serif;
      letter-spacing: -0.035em;
      margin-bottom: 10px;
    }

    /* Progress */
    .progress-container {
      background: linear-gradient(110deg, rgba(255,255,255,0.075), rgba(255,255,255,0.035));
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 17px 18px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .progress-bar-bg {
      flex: 1;
      height: 8px;
      background: rgba(8, 7, 14, 0.56);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #2dd4bf, var(--success));
      width: 0%;
      transition: width 0.5s ease;
    }

    .progress-text {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 600;
      min-width: 45px;
    }

    /* Tips */
    .tip-card {
      background: linear-gradient(90deg, rgba(251, 191, 36, 0.14), rgba(251, 191, 36, 0.035));
      border: 1px solid rgba(251, 191, 36, 0.25);
      border-left: 4px solid var(--warning);
      padding: 16px 20px;
      border-radius: 0 14px 14px 0;
      margin-bottom: 24px;
      display: flex;
      gap: 12px;
    }
    .tip-icon { font-size: 20px; }
    .tip-content { font-size: 14px; line-height: 1.6; color: #fef3c7; }

    /* Accordion */
    .qna-card {
      background: linear-gradient(120deg, rgba(255,255,255,0.075), rgba(255,255,255,0.035));
      border: 1px solid var(--card-border);
      border-radius: 16px;
      margin-bottom: 16px;
      overflow: hidden;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }
    .qna-card:hover {
      border-color: rgba(216, 180, 254, 0.35);
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(0,0,0,0.14);
    }

    .qna-header {
      padding: 20px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .q-text {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.5;
      padding-right: 16px;
      flex: 1;
    }

    .qna-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .reviewed-cb {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: var(--success);
    }

    .chevron {
      transition: transform 0.3s ease;
      color: var(--text-muted);
    }

    .qna-card.expanded .chevron {
      transform: rotate(180deg);
    }

    .qna-card.expanded { border-color: rgba(192, 132, 252, 0.48); }

    .qna-body {
      padding: 0 20px;
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-height 0.4s ease, padding 0.4s ease, opacity 0.3s ease;
    }

    .qna-card.expanded .qna-body {
      padding: 0 20px 20px 20px;
      opacity: 1;
      max-height: 2000px;
    }

    .answer {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
    
    .answer strong { color: var(--text); }
    .answer code { background: rgba(9, 7, 17, 0.6); padding: 2px 6px; border-radius: 5px; color: var(--accent-secondary); }

    .mermaid-wrapper {
      background: #000;
      border-radius: 12px;
      padding: 16px;
      margin: 16px 0;
      overflow-x: auto;
    }

    /* Follow ups */
    .follow-up {
      margin-top: 16px;
      padding-left: 16px;
      border-left: 2px solid rgba(192, 132, 252, 0.8);
    }
    
    .follow-up-q {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }
    
    .follow-up-a {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-muted);
    }

    /* Dashboard specific */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: linear-gradient(140deg, rgba(255,255,255,0.09), rgba(255,255,255,0.035));
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 25px;
      text-align: left;
      position: relative;
      overflow: hidden;
    }
    .stat-value {
      font-size: 36px;
      font-weight: 800;
      color: #f0abfc;
      margin-bottom: 8px;
    }
    .stat-label {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .stat-card::after {
      content: '';
      width: 72px;
      height: 72px;
      position: absolute;
      right: -28px;
      top: -28px;
      border-radius: 50%;
      background: var(--accent-glow);
    }

    /* Sticky Notes */
    .sticky-notes-panel {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 340px;
      background: rgba(30, 26, 45, 0.96);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      z-index: 100;
      transform: translateY(120%);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .sticky-notes-panel.open { transform: translateY(0); }

    .sticky-header {
      padding: 16px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.02);
      border-radius: 16px 16px 0 0;
    }
    .sticky-title { font-weight: 600; display: flex; gap: 8px; align-items: center; }
    
    .sticky-body {
      padding: 16px;
    }
    .sticky-textarea {
      width: 100%;
      height: 200px;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 14px;
      line-height: 1.6;
      resize: none;
      outline: none;
    }
    .sticky-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    .fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-deep), #d946ef);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--accent-glow);
      z-index: 99;
      border: none;
      transition: transform 0.2s;
    }
    .fab:hover { transform: scale(1.05); }

    @media (max-width: 760px) {
      body { height: auto; min-height: 100vh; overflow: auto; flex-direction: column; }
      .sidebar { width: 100%; padding: 14px 16px 10px; overflow: hidden; border-right: 0; border-bottom: 1px solid var(--card-border); }
      .logo { margin: 0 4px 10px; }
      #nav-links { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 4px; }
      .nav-link { flex: 0 0 auto; margin: 0; padding: 8px 10px; font-size: 13px; }
      .main-wrapper { min-height: 0; }
      .topbar { height: auto; min-height: 64px; padding: 12px 16px; gap: 10px; align-items: flex-start; }
      .calendar-dots, #current-date { display: none; }
      .streak-text { font-size: 14px; white-space: nowrap; }
      .btn { padding: 8px 12px; font-size: 12px; }
      .content { padding: 30px 16px 90px; }
      .section-title { font-size: 33px; }
      .qna-header { padding: 16px; }
      .q-text { font-size: 15px; }
      .qna-actions { gap: 10px; }
      .sticky-notes-panel { width: calc(100% - 32px); right: 16px; bottom: 16px; }
      .fab { right: 16px; bottom: 16px; }
    }

  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="logo">
      ✨ <span>Interview Hub</span>
    </div>
    <nav id="nav-links">
      <!-- Generated by JS -->
    </nav>
  </aside>

  <main class="main-wrapper">
    <header class="topbar">
      <div class="streak-container">
        <div class="streak-text">
          🔥 <span id="streak-count">0</span> Day Streak
        </div>
        <div class="calendar-dots" id="calendar-dots">
          <!-- Dots generated via JS -->
        </div>
      </div>
      <div style="display: flex; gap: 16px; align-items: center;">
        <span id="current-date" style="color: var(--text-muted); font-weight: 500; font-size: 14px;"></span>
        <button class="btn" id="btn-install-app" hidden>Install app</button>
        <button class="btn btn-primary" id="btn-mark-today">Mark Today Studied</button>
      </div>
    </header>

    <div class="content" id="content-area">
      <!-- Sections generated by JS -->
    </div>
  </main>

  <button class="fab" id="fab-notes">📝</button>

  <div class="sticky-notes-panel" id="notes-panel">
    <div class="sticky-header">
      <div class="sticky-title">📝 My Notes</div>
      <button class="btn" style="padding: 4px 8px; font-size: 12px;" id="btn-clear-notes">Clear</button>
    </div>
    <div class="sticky-body">
      <textarea class="sticky-textarea" id="notes-textarea" placeholder="Jot down quick thoughts, answers you forget, or things to look up..."></textarea>
    </div>
    <div class="sticky-footer">
      <span id="notes-status">Saved</span>
    </div>
  </div>

  <script>
    const data = [
      {
        id: "dashboard",
        title: "Dashboard",
        icon: "🏠",
        isDashboard: true
      },
      {
        id: "ragos",
        title: "RAGOS",
        icon: "🚀",
        tips: [
          "When they ask about RAGOS, lead with the architecture decision—not the definition of RAG.",
          "The 'hardest bug' question is guaranteed. Prepare: 'Async experiments writing to the same ChromaDB collection caused race conditions—I had to implement per-experiment collection namespacing.'"
        ],
        items: [
          {
            q: "What is RAGOS? Give me the pitch.",
            a: "RAGOS is an 'AutoML for RAG'—a framework-agnostic platform that automatically searches for the optimal RAG pipeline configuration under user-specified constraints. Instead of manually tuning chunk sizes, retrieval strategies, and generation models, you submit declarative objectives like 'maximize faithfulness, latency ≤ 500ms, cost ≤ $0.01/query', and the engine runs constraint-aware Random Search across 100+ configurations, evaluating each one automatically, and returns a Pareto-optimal set of pipelines.",
            diagram: `flowchart TD\n    A[POST /experiments] --> B[Pydantic Validation]\n    B --> C[Store in PostgreSQL]\n    C --> D[optimizer.py]\n    D --> E[Sample Config]\n    E --> F{Constraint Check}\n    F -- Violates --> E\n    F -- OK --> G[experiments/runner.py]\n    G --> H[Ingest + Embed]\n    H --> I[ChromaDB]\n    I --> J[Retrieve]\n    J --> K[Generate via LiteLLM]\n    K --> L[Evaluate]\n    L --> M[Store Result]\n    M --> D\n    D --> N[pareto.py]\n    N --> O[Return Pareto Set]`,
            followUps: [
              {
                q: "Why Random Search over Grid Search or Bayesian Optimization?",
                a: "Grid Search is exponential in the number of hyperparameters—with 5 dimensions at 5 values each, you need 3125 trials. Random Search achieves comparable results with far fewer trials because in high-dimensional spaces, a random sample covers the space well. Bayesian Optimization (TPE, Gaussian Processes) would be better for exploitation, but it adds significant complexity and requires a large initial sample to build a good surrogate model. Random Search is a pragmatic starting point that gives good results fast."
              },
              {
                q: "What does 'constraint-aware' specifically mean in your implementation?",
                a: "Before executing a trial, the optimizer checks the sampled configuration against the user's constraints—latency budget, cost budget, local-only flag. Configurations that obviously violate constraints (e.g., cloud-only model when local_only=True) are filtered before execution, saving unnecessary API calls. After execution, measured latency and cost are checked against constraints, and constraint-violating results are excluded from the Pareto frontier."
              },
              {
                q: "What is a Pareto frontier and why use it instead of a single weighted score?",
                a: "A Pareto frontier contains all configurations that are not dominated by any other. Config A dominates Config B if A is at least as good in all dimensions and strictly better in at least one. The frontier exposes the true tradeoffs—a 500ms config at $0.001 vs a 200ms config at $0.005—and lets the user choose based on their priorities. A weighted score collapses this into a single value, which forces you to decide weights upfront and hides the actual tradeoffs."
              },
              {
                q: "How does the plugin architecture work? How would I add a new retriever?",
                a: "The core/interfaces.py defines abstract base classes—BaseRetriever, BaseEmbedder, BaseGenerator, BaseEvaluator. Each has a required interface (e.g., retrieve(query, k) → List[Document]). To add a new retriever, you implement BaseRetriever and register it in plugins.py. The optimizer works only with the abstract interface, so it never needs to know about concrete implementations. This is the Open/Closed Principle—the optimization engine is closed for modification but open for extension."
              },
              {
                q: "What if all 100+ configurations violate the constraints?",
                a: "The optimizer returns an empty Pareto set with an explanatory message. The API would return a 200 with a constraint_violations field explaining which constraints are impossible to satisfy simultaneously—e.g., latency ≤ 100ms AND faithfulness ≥ 0.9 might be mutually exclusive with the available models. The user must relax constraints and re-run."
              },
              {
                q: "How does automated evaluation work? How reliable is LLM-as-judge?",
                a: "Each trial runs the RAG pipeline on a test query set, then the evaluator (evaluation/judge.py) sends the generated answer, the retrieved context, and the ground truth to an LLM and asks it to score faithfulness (does the answer stay true to the context?) and relevance (does it address the question?). Reliability is a known limitation—LLM-as-judge has positional bias and verbosity bias. For high-stakes evaluation, you'd want RAGAS with multiple judges and human validation. For automated hyperparameter search, it's directionally accurate enough."
              },
              {
                q: "RAGOS architecture—walk me through the request flow end-to-end.",
                a: "(1) User submits POST /experiments with constraints JSON. (2) FastAPI validates via Pydantic, stores experiment spec in PostgreSQL. (3) The optimizer.py samples configurations from dimensions.py, filters via constraints.py. (4) For each config, experiments/runner.py executes the full RAG pipeline: ingest documents → embed → store in ChromaDB → retrieve → generate via LiteLLM. (5) Evaluator scores the result. (6) Cost tracker logs token usage. (7) Results stored in PostgreSQL. (8) After all trials, pareto.py computes the frontier. (9) GET /experiments/{id} returns results with Pareto set."
              },
              {
                q: "Why PostgreSQL AND ChromaDB? What goes where?",
                a: "PostgreSQL stores structured, relational data—experiment metadata, configuration parameters, evaluation scores, cost logs, user data. ChromaDB stores vector embeddings—the actual embedding vectors for document chunks, indexed for ANN similarity search. They serve fundamentally different access patterns: PostgreSQL for filtering, joining, aggregating; ChromaDB for nearest-neighbor lookup in high-dimensional space."
              },
              {
                q: "What happens if ChromaDB goes down mid-experiment?",
                a: "The trial fails with an exception. The runner should catch it, mark the trial as FAILED in PostgreSQL, and continue with remaining trials. A retry mechanism could re-attempt failed trials. The experiment would complete with fewer results, with failed trials clearly marked."
              }
            ]
          },
          {
            q: "What would you change if you rebuilt RAGOS today?",
            a: "Four things: (1) Replace Random Search with Bayesian Optimization using Optuna—it would find good configurations with 3-5x fewer trials. (2) Add distributed execution via Celery so trials run on multiple workers in parallel. (3) Replace LLM-as-judge with RAGAS framework for more reliable evaluation. (4) Add real-time progress streaming via WebSockets instead of polling for results."
          }
        ]
      },
      {
        id: "llm_cost_guard",
        title: "LLM Cost Guard",
        icon: "💰",
        tips: [
          "The Redis Lua script question is the #1 differentiator. Know TOCTOU cold.",
          "If they push on K8s/AWS depth: 'I containerized everything and wrote K8s manifests for local Minikube deployment to ensure cloud-native architecture. Production-scale K8s ops is something I'm actively learning.'"
        ],
        items: [
          {
            q: "Explain the core problem LLM Cost Guard solves.",
            a: "LLM APIs are expensive and unpredictable in multi-tenant environments. Without centralized control, any service can make unlimited LLM calls, budgets get blown, and there's no visibility into who's spending what. LLM Cost Guard is a proxy gateway—all LLM traffic goes through it. It enforces per-organization token budgets, routes intelligently to the cheapest or fastest provider, and caches semantically similar requests.",

          { q: "Docker vs VM?", a: "VMs virtualize hardware, run a full guest OS kernel—boot in minutes, use gigabytes of RAM. Containers virtualize the OS, share the host kernel—start in milliseconds, use megabytes. VMs provide stronger isolation. Containers are better for microservices, CI/CD, and rapid deployment." },
          { q: "Git rebase vs merge?", a: "Merge: creates a merge commit, preserves exact history, non-destructive. Rebase: rewrites commits onto target branch tip, linear history, changes commit SHAs (don't rebase shared branches). Use rebase to clean local feature branch before PR, merge to integrate PR into main." },
          { q: "What is CI/CD?", a: "CI (Continuous Integration): automatically build and test every commit. CD (Continuous Delivery/Deployment): automatically deploy passing builds to staging/production. Key principle: main branch is always deployable. GitHub Actions: YAML workflow triggered on push/PR, runs on ubuntu-latest runner, executes lint + test + build steps." }
        ]
      },
      {
        id: "hr",
        title: "HR",
        icon: "🤝",
        tips: [],
        items: [
          { q: "Tell me about yourself.", a: "Lead with: 'I'm a third-year EE student at NIT Jamshedpur, but my work is in backend systems and AI infrastructure.' Then: one sentence on Cordum contribution, one on strongest project (LLM Cost Guard/RAGOS), close with: 'I'm focused on building systems that are actually reliable at scale—which is why [Company] interests me.'" },
          { q: "Why EE if you want CS/AI?", a: "'EE and backend are the same problem at different abstraction levels. EE: optimize for power, signal noise, hardware constraints. Backend: optimize for CPU cycles, memory, network latency. My EE training gave me first-principles thinking I apply to every systems design problem. It's a superpower, not a detour.'" },
          { q: "Your CGPA is 7.57—defend it.", a: "'I balanced a rigorous EE curriculum with sustained project work, research, open-source contribution, and competitions. I prefer to show concrete work I can explain clearly—design choices, code, and evidence—rather than hide behind a single metric.'" },
          { q: "Biggest weakness?", a: "'I sometimes over-invest in understanding internals before building. I spent days reading HNSW papers before implementing ChromaDB for RAGOS. I've learned to balance 'understand deeply' with 'ship iteratively.'" }
        ]
      },
      {
        id: "ee_basics",
        title: "EE Basics",
        icon: "⚡",
        tips: [],
        items: [
          { q: "How does EE background help in software?", a: "Signal processing → FFT for audio ML, convolutions in CNNs (I used YOLOv8 which is all convolutions). Control systems → PID controllers in ArduPilot ROVs. Digital electronics → understanding CPU architecture, bitwise ops. Power constraints → edge AI optimization (Focus Lock's entropy-based CPU reduction)." },
          { q: "What is a Fourier Transform?", a: "Decomposes a time-domain signal into constituent frequencies. Time → frequency domain. Used in ML: raw audio is hard to train on; FFT → spectrogram → CNN works well. Convolution in CNNs is related: in frequency domain, convolution becomes multiplication." },
          { q: "Open-loop vs closed-loop?", a: "Open-loop: no feedback (toaster runs N minutes regardless). Closed-loop: measures output, feeds back to adjust input (thermostat, PID controller). PID: Proportional (current error) + Integral (accumulated past error, fixes steady-state) + Derivative (rate of change, dampens oscillation). Used in ArduPilot for ROV/drone stability." }
        ]
      }
    ];

    // Initialize Mermaid
    mermaid.initialize({ startOnLoad: false, theme: 'dark' });

    const state = {
      activeSection: 'dashboard',
      streakDates: JSON.parse(localStorage.getItem('ish_streak_dates') || '[]'),
      notes: localStorage.getItem('ish_notes') || '',
      checkedItems: {} // loaded dynamically
    };

    // Use the local calendar date. `toISOString()` uses UTC and can otherwise
    // assign a late-night study session to the wrong day.
    const getTodayISO = () => {
      const now = new Date();
      const local = new Date(now.getTime() - now.getTimezoneOffset() * 60_000);
      return local.toISOString().split('T')[0];
    };

    // Helper functions
    function calculateStreak() {
      if (state.streakDates.length === 0) return 0;
      let sorted = [...new Set(state.streakDates)].sort().reverse();
      let streak = 0;
      let current = new Date(getTodayISO());
      
      // If last marked date is neither today nor yesterday, streak is broken
      const lastMarked = new Date(sorted[0]);
      const diffDays = Math.floor((current - lastMarked) / (1000 * 60 * 60 * 24));
      
      if (diffDays > 1) return 0;

      for (let dateStr of sorted) {
        const d = new Date(dateStr);
        const diff = Math.floor((current - d) / (1000 * 60 * 60 * 24));
        if (diff === 0 || diff === 1) {
          streak++;
          current = d; // move current back
        } else {
          break;
        }
      }
      return streak;
    }

    function renderCalendarDots() {
      const container = document.getElementById('calendar-dots');
      container.innerHTML = '';
      const today = new Date(getTodayISO());
      for (let i = 29; i >= 0; i--) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const local = new Date(d.getTime() - d.getTimezoneOffset() * 60_000);
        const dStr = local.toISOString().split('T')[0];
        
        const dot = document.createElement('div');
        dot.className = 'dot';
        if (state.streakDates.includes(dStr)) dot.classList.add('active');
        container.appendChild(dot);
      }
    }

    function updateStreakUI() {
      document.getElementById('streak-count').innerText = calculateStreak();
      renderCalendarDots();
      
      const btn = document.getElementById('btn-mark-today');
      if (state.streakDates.includes(getTodayISO())) {
        btn.innerText = 'Studied Today ✓';
        btn.style.background = 'var(--success)';
        btn.style.borderColor = 'var(--success)';
        btn.disabled = true;
      }
    }

    document.getElementById('btn-mark-today').addEventListener('click', () => {
      const today = getTodayISO();
      if (!state.streakDates.includes(today)) {
        state.streakDates.push(today);
        localStorage.setItem('ish_streak_dates', JSON.stringify(state.streakDates));
        updateStreakUI();
      }
    });

    // Notes
    const notesTextarea = document.getElementById('notes-textarea');
    const notesStatus = document.getElementById('notes-status');
    notesTextarea.value = state.notes;

    let noteTimeout;
    notesTextarea.addEventListener('input', (e) => {
      notesStatus.innerText = 'Saving...';
      clearTimeout(noteTimeout);
      noteTimeout = setTimeout(() => {
        localStorage.setItem('ish_notes', e.target.value);
        notesStatus.innerText = `Saved at ${new Date().toLocaleTimeString()}`;
      }, 500);
    });

    document.getElementById('fab-notes').addEventListener('click', () => {
      document.getElementById('notes-panel').classList.toggle('open');
    });

    document.getElementById('btn-clear-notes').addEventListener('click', () => {
      if (confirm('Clear all notes?')) {
        notesTextarea.value = '';
        localStorage.setItem('ish_notes', '');
        notesStatus.innerText = 'Cleared';
      }
    });

    // Install as a standalone app where the browser supports it (Chrome/Edge/Android).
    // On iPhone/iPad, Safari exposes the native “Add to Home Screen” menu instead.
    let deferredInstallPrompt;
    const installButton = document.getElementById('btn-install-app');

    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      deferredInstallPrompt = event;
      installButton.hidden = false;
    });

    installButton.addEventListener('click', async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      installButton.hidden = true;
    });

    window.addEventListener('appinstalled', () => {
      installButton.hidden = true;
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {
          // The hub still works normally if the host does not support service workers.
        });
      });
    }

    // Render DOM
    function renderApp() {
      document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
      
      const navContainer = document.getElementById('nav-links');
      const contentContainer = document.getElementById('content-area');

      let totalItems = 0;
      let totalChecked = 0;

      data.forEach(sec => {
        // Nav Link
        const link = document.createElement('a');
        link.className = `nav-link ${sec.id === state.activeSection ? 'active' : ''}`;
        link.dataset.section = sec.id;
        link.setAttribute('aria-label', `Open ${sec.title}`);
        link.innerHTML = `<span>${sec.icon}</span> ${sec.title}`;
        link.onclick = () => switchSection(sec.id);
        navContainer.appendChild(link);

        // Section Content
        const sectionEl = document.createElement('div');
        sectionEl.className = `section ${sec.id === state.activeSection ? 'active' : ''}`;
        sectionEl.id = `section-${sec.id}`;

        if (sec.isDashboard) {
          sectionEl.innerHTML = `
            <div class="section-header">
              <p style="color: var(--accent-secondary); font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 10px;">Your prep space</p>
              <h1 class="section-title">Show up prepared.</h1>
              <p style="color: var(--text-muted); max-width: 530px; line-height: 1.65;">Keep the momentum small and consistent—one strong answer at a time.</p>
            </div>
            <div class="stats-grid" id="dashboard-stats"></div>
          `;
          contentContainer.appendChild(sectionEl);
          return;
        }

        let sectionItems = sec.items ? sec.items.length : 0;
        let sectionChecked = 0;

        let html = `
          <div class="section-header">
            <h1 class="section-title">${sec.icon} ${sec.title}</h1>
          </div>
        `;

        if (sec.items && sec.items.length > 0) {
          html += `
            <div class="progress-container">
              <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-fill-${sec.id}"></div>
              </div>
              <div class="progress-text" id="progress-text-${sec.id}">0%</div>
            </div>
          `;
        }

        if (sec.tips) {
          sec.tips.forEach(tip => {
            html += `
              <div class="tip-card">
                <div class="tip-icon">⚡</div>
                <div class="tip-content">${tip}</div>
              </div>
            `;
          });
        }

        if (sec.items) {
          sec.items.forEach((item, idx) => {
            totalItems++;
            const isChecked = localStorage.getItem(`ish_checked_${sec.id}_${idx}`) === 'true';
            if (isChecked) { sectionChecked++; totalChecked++; }

            let bodyHtml = `<div class="answer">${marked.parse(item.a)}</div>`;
            
            if (item.diagram) {
              bodyHtml += `<div class="mermaid-wrapper"><div class="mermaid">${item.diagram}</div></div>`;
            }

            if (item.followUps) {
              item.followUps.forEach(f => {
                bodyHtml += `
                  <div class="follow-up">
                    <div class="follow-up-q">${f.q}</div>
                    <div class="follow-up-a">${marked.parse(f.a)}</div>
                  </div>
                `;
              });
            }

            html += `
              <div class="qna-card">
                <div class="qna-header" onclick="toggleCard(this)">
                  <div class="q-text">${item.q}</div>
                  <div class="qna-actions">
                    <input type="checkbox" class="reviewed-cb" ${isChecked ? 'checked' : ''} 
                           onclick="event.stopPropagation(); toggleCheck('${sec.id}', ${idx}, this)">
                    <span class="chevron">▼</span>
                  </div>
                </div>
                <div class="qna-body">${bodyHtml}</div>
              </div>
            `;
          });
        }

        sectionEl.innerHTML = html;
        contentContainer.appendChild(sectionEl);

        // Update initial progress
        if (sectionItems > 0) {
          setTimeout(() => {
            const pct = Math.round((sectionChecked / sectionItems) * 100);
            document.getElementById(`progress-fill-${sec.id}`).style.width = pct + '%';
            document.getElementById(`progress-text-${sec.id}`).innerText = pct + '%';
          }, 100);
        }
      });

      // Dashboard stats
      const focusTopics = data.filter(d => !d.isDashboard).map(d => d.title);
      const todayFocus = focusTopics[new Date().getDate() % focusTopics.length];
      
      document.getElementById('dashboard-stats').innerHTML = `
        <div class="stat-card">
          <div class="stat-value">${Math.round((totalChecked / (totalItems || 1)) * 100)}%</div>
          <div class="stat-label">Overall Progress</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${totalChecked} / ${totalItems}</div>
          <div class="stat-label">Questions Reviewed</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" style="font-size:24px; margin-top: 10px">${todayFocus}</div>
          <div class="stat-label">Today's Focus</div>
        </div>
      `;

      // Render diagrams
      mermaid.init(undefined, document.querySelectorAll('.mermaid'));
    }

    window.switchSection = function(id) {
      state.activeSection = id;
      
      // Update nav links without relying on the browser's legacy global `event`.
      document.querySelectorAll('.nav-link').forEach(el => {
        el.classList.toggle('active', el.dataset.section === id);
      });

      // Update sections
      document.querySelectorAll('.section').forEach(el => {
        el.classList.remove('active');
      });
      document.getElementById(`section-${id}`).classList.add('active');

      document.querySelector('.content').scrollTop = 0;
    };

    window.toggleCard = function(headerEl) {
      const card = headerEl.closest('.qna-card');
      card.classList.toggle('expanded');
    };

    window.toggleCheck = function(secId, idx, cb) {
      localStorage.setItem(`ish_checked_${secId}_${idx}`, cb.checked);
      
      // Recalculate section progress
      const secData = data.find(d => d.id === secId);
      let checkedCount = 0;
      secData.items.forEach((_, i) => {
        if (localStorage.getItem(`ish_checked_${secId}_${i}`) === 'true') checkedCount++;
      });
      
      const pct = Math.round((checkedCount / secData.items.length) * 100);
      document.getElementById(`progress-fill-${secId}`).style.width = pct + '%';
      document.getElementById(`progress-text-${secId}`).innerText = pct + '%';

      // Re-render dashboard stats silently
      let totalChecked = 0;
      let totalItems = 0;
      data.forEach(d => {
        if (d.items) {
          totalItems += d.items.length;
          d.items.forEach((_, i) => {
            if (localStorage.getItem(`ish_checked_${d.id}_${i}`) === 'true') totalChecked++;
          });
        }
      });
      const statValueEls = document.querySelectorAll('.stat-value');
      if (statValueEls.length > 0) {
        statValueEls[0].innerText = Math.round((totalChecked / (totalItems || 1)) * 100) + '%';
        statValueEls[1].innerText = `${totalChecked} / ${totalItems}`;
      }
    };

    // Init
    updateStreakUI();
    renderApp();
  </script>
</body>
</html>
